services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: multitenant_app
    restart: unless-stopped
    ports:
      - "8000:80"
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
      APP_URL: http://localhost:8000
      CENTRAL_DOMAIN: localhost
      DB_CONNECTION: landlord
      LANDLORD_DB_DATABASE: /var/www/html/database/database.sqlite
    volumes:
      - ./multi-tenant-webshop/database/tenants:/var/www/html/database/tenants
      - ./multi-tenant-webshop/storage/app/public:/var/www/html/storage/app/public
